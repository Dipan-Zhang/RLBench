INFERENCE_GSAM: True
USE_GSNET: True
SAVE_ROOT: "simulation/outputs/"
DATA_SOURCE: "droid"

# cam
cameras: ["front", "left_shoulder", "right_shoulder", "wrist"]
cam_w: 512
cam_h: 512


gsnet:
  save_files: False
  dataset_root: ""
  checkpoint_path: ../RAM_code/assets/ckpts/minkuresunet_kinect.tar
  dump_dir: ./logs/
  seed_feat_dim: 512
  camera: kinect
  num_point: 15000
  batch_size: 1
  voxel_size: 0.005
  collision_thresh: 0.0000
  voxel_size_cd: 0.01
  infer: True
  vis: False

